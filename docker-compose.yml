services:
  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: challenge_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - db_net

  # ─── Isolated Code Runner ───────────────────────────────────────
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: challenge_runner
    restart: unless-stopped
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - RUNNER_SHARED_SECRET=${RUNNER_SHARED_SECRET}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - runner_net

  # ─── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: challenge_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks:
      - edge_net
      - db_net
      - runner_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Telegram Bot (aiogram 3.x) ─────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: challenge_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/backend:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge_net
      - db_net

  # ─── Frontend (React + nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: challenge_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge_net

  # ─── Nginx (Reverse Proxy) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: challenge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      edge_net:
        ipv4_address: 172.28.1.10

volumes:
  postgres_data2:

networks:
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  db_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/24
  runner_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24
